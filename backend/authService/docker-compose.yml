services:
  postgres:
   image: postgres:17

   container_name: silver_postgres 

   restart: unless-stopped

   environment:
     POSTGRES_USER: silver_shop_user
     POSTGRES_PASSWORD: SILVER
     POSTGRES_DB: silver_shop_auth

   ports:
    - "5433:5432"

   volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: