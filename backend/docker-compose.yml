# Silver Shop — единая точка запуска всего бэкенда:
#   docker compose up -d          (из корня репозитория)
#   docker compose ps             (проверка)
#   docker compose down           (остановка, данные целы в postgres_data)
#
# Один Postgres (silver_postgres, база silver_shop_auth) на оба сервиса.
# Два compose-файла создали бы два volume и две РАЗНЫЕ базы.
# Один файл = одна база = auth и product видят одни и те же данные.
name: silver-shop

services:
  # Единственный Postgres на оба сервиса — одна база silver_shop_auth.
  postgres:
    image: postgres:17
    container_name: silver_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: silver_shop_user
      POSTGRES_PASSWORD: SILVER
      POSTGRES_DB: silver_shop_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silver_shop_user -d silver_shop_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: silver-shop:latest
    env_file:
      - ./backend/authService/.env
    environment:
      SERVICE: auth-service
      PORT: "3000"
      # Внутри сети compose Postgres доступен по имени сервиса.
      DATABASE_URL: "postgresql://silver_shop_user:SILVER@postgres:5432/silver_shop_auth"
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  product-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: silver-shop:latest
    env_file:
      - ./backend/productService/.env
    environment:
      SERVICE: product-service
      PORT: "3001"
      DATABASE_URL: "postgresql://silver_shop_user:SILVER@postgres:5432/silver_shop_auth"
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
